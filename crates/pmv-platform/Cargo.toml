[package]
name = "pmv-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PMV-Genie pmv-platform crate"

[dependencies]
pmv-core = { path = "../pmv-core" }
# The FFmpeg binding proved by the binding spike: rsmpeg 0.18.0 against
# FFmpeg 8.1.2. Building it on this machine needs the dev overlay
# environment documented in crates/pmv-media/README.md.
rsmpeg = { version = "0.18.0", features = ["link_system_ffmpeg"] }
