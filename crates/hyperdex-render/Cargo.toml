[package]
name = "hyperdex-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "HyperDex composition and rendering engine"

[dependencies]
hyperdex-core = { path = "../hyperdex-core" }
# All FFmpeg access stays in hyperdex-platform (decode, probe, and the new
# VideoEncoder); this crate consumes its plain data frames only.
hyperdex-platform = { path = "../hyperdex-platform" }
serde = { workspace = true }
serde_json = { workspace = true }
# The owned compositor: wgpu 0.20, the version the compositor spike
# proved on the llvmpipe software adapter (see
# ~/workspace/spikes/compositor-spike/RESULTS.md).
wgpu = "0.20"
pollster = "0.3"

[dev-dependencies]
hyperdex-audio = { path = "../hyperdex-audio" }
