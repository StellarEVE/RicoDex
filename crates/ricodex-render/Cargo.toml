[package]
name = "music video-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "RicoDex music video-render crate"

[dependencies]
music video-core = { path = "../music video-core" }
# All FFmpeg access stays in music video-platform (decode, probe, and the new
# VideoEncoder); this crate consumes its plain data frames only.
music video-platform = { path = "../music video-platform" }
serde = { workspace = true }
serde_json = { workspace = true }
# The owned compositor: wgpu 0.20, the version the compositor spike
# proved on the llvmpipe software adapter (see
# ~/workspace/spikes/compositor-spike/RESULTS.md).
wgpu = "0.20"
pollster = "0.3"
