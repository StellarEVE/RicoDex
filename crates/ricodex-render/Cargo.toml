[package]
name = "ricodex-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "RicoDex composition and rendering engine"

[dependencies]
ricodex-core = { path = "../ricodex-core" }
# All FFmpeg access stays in ricodex-platform (decode, probe, and the new
# VideoEncoder); this crate consumes its plain data frames only.
ricodex-platform = { path = "../ricodex-platform" }
serde = { workspace = true }
serde_json = { workspace = true }
# The owned compositor: wgpu 0.20, the version the compositor spike
# proved on the llvmpipe software adapter (see
# ~/workspace/spikes/compositor-spike/RESULTS.md).
wgpu = "0.20"
pollster = "0.3"

[dev-dependencies]
ricodex-audio = { path = "../ricodex-audio" }
