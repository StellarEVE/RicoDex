[package]
name = "ricodex-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "RicoDex desktop application front end"

[dependencies]
ricodex-core = { path = "../ricodex-core" }
ricodex-audio = { path = "../ricodex-audio" }
ricodex-media = { path = "../ricodex-media" }
ricodex-engine = { path = "../ricodex-engine" }
ricodex-render = { path = "../ricodex-render" }
# The interface toolkit lives only in this crate, so the front end
# stays replaceable (see tools/check_layers.sh). egui 0.37 is the
# current release the crates index offers; eframe is its runner.
# Compile both renderers. RicoDex defaults to glow for Windows
# startup compatibility; wgpu remains available as an explicit opt-in.
eframe = { version = "0.37", features = ["glow"] }
egui = "0.37"
# Native file dialogs for import and export paths. Paths can also
# arrive through the RICODEX_IMPORT and RICODEX_EXPORT environment
# variables, which is how the automated runs drive the app.
rfd = "0.18"
# Writing the RICODEX_SHOT screenshot captures.
png = "0.18"
