[package]
name = "hyperdex-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "HyperDex media codec and hardware platform layer"

[dependencies]
hyperdex-core = { path = "../hyperdex-core" }
# The FFmpeg binding proved by the binding spike: rsmpeg 0.18.0 against
# FFmpeg 8.1.2. Building it on this machine needs the dev overlay
# environment documented in crates/hyperdex-media/README.md.
rsmpeg = { version = "0.18.0", features = ["link_system_ffmpeg"] }
