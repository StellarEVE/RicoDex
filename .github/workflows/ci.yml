name: Windows CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: |
          rustup update stable
          rustup default stable
          rustc --version
          cargo --version
      - name: Download FFmpeg shared development build
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-lgpl-shared-8.1.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg-shared.zip
          $archiveHash = (Get-FileHash ffmpeg-shared.zip -Algorithm SHA256).Hash
          "FFMPEG_ARCHIVE_SHA256=$archiveHash" | Out-File -FilePath $env:GITHUB_ENV -Append
          Expand-Archive ffmpeg-shared.zip -DestinationPath ffmpeg-shared
          $root = Get-ChildItem ffmpeg-shared -Directory | Select-Object -First 1
          if (-not (Test-Path "$($root.FullName)\include\libavutil\avutil.h")) { throw "FFmpeg headers were not found." }
          if (-not (Test-Path "$($root.FullName)\lib\avutil.lib")) { throw "FFmpeg import libraries were not found." }
          "FFMPEG_ROOT=$($root.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Configure FFmpeg and bindgen
        shell: pwsh
        run: |
          "FFMPEG_DLL_PATH=$env:FFMPEG_ROOT\lib" | Out-File -FilePath $env:GITHUB_ENV -Append
          "FFMPEG_INCLUDE_DIR=$env:FFMPEG_ROOT\include" | Out-File -FilePath $env:GITHUB_ENV -Append
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$env:FFMPEG_ROOT\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Download GPL FFmpeg for H.264 test fixtures only
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-gpl-shared-8.1.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg-test-gpl.zip
          Expand-Archive ffmpeg-test-gpl.zip -DestinationPath ffmpeg-test-gpl
          $testRoot = Get-ChildItem ffmpeg-test-gpl -Directory | Select-Object -First 1
          $testFfmpeg = Join-Path $testRoot.FullName "bin\ffmpeg.exe"
          if (-not (Test-Path $testFfmpeg)) { throw "Test-only FFmpeg executable was not found." }
          $encoders = (& $testFfmpeg -hide_banner -encoders 2>&1 | Out-String)
          if ($encoders -notmatch "libx264") { throw "Test-only FFmpeg build does not provide libx264." }
          "RICODEX_TEST_FFMPEG=$testFfmpeg" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Run workspace tests
        shell: pwsh
        run: |
          cargo test --workspace
      - name: Build release binaries
        run: cargo build --release --workspace
      - name: Download Microsoft Visual C++ Redistributable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile "$PWD\vc_redist.x64.exe"
      - name: Stage portable application and runtime dependencies
        shell: pwsh
        run: |
          ./tools/package_windows.ps1 `
            -FfmpegRoot "$env:FFMPEG_ROOT" `
            -VcRedistPath "$PWD\vc_redist.x64.exe" `
            -FfmpegArchiveSha256 "$env:FFMPEG_ARCHIVE_SHA256"
      - name: Create portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\portable\*" -DestinationPath "dist\RicoDex-Windows-x64.zip" -CompressionLevel Optimal
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe" | Select-Object -First 1
          if (-not $iscc) { throw "Inno Setup compiler was not found." }
          & $iscc.FullName "installer\ricodex.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE." }
      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: RicoDex-Windows-packages-${{ github.sha }}
          path: |
            dist/RicoDex-Windows-x64.zip
            dist/RicoDex-*-setup.exe
          if-no-files-found: error
          retention-days: 14
