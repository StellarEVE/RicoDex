[workspace]
resolver = "2"
members = [
    "crates/ricodex-core",
    "crates/ricodex-audio",
    "crates/ricodex-media",
    "crates/ricodex-platform",
    "crates/ricodex-render",
    "crates/ricodex-engine",
    "crates/ricodex-app",
    "crates/ricodex-cli",
]

[workspace.package]
version = "0.1.0-alpha.9"
edition = "2021"
license = "Apache-2.0"
description = "RicoDex: a local beat-synced music video editor"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
