[workspace]
resolver = "2"
members = [
    "crates/hyperdex-core",
    "crates/hyperdex-audio",
    "crates/hyperdex-media",
    "crates/hyperdex-platform",
    "crates/hyperdex-render",
    "crates/hyperdex-engine",
    "crates/hyperdex-app",
    "crates/hyperdex-cli",
]

[workspace.package]
version = "0.1.0-alpha.9"
edition = "2021"
license = "Apache-2.0"
description = "HyperDex Studio: a local beat-synced music video editor"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[patch.crates-io]
# Keep the FFmpeg 8.1 Windows enum ABI fix until upstream rsmpeg handles the
# MSVC binding's unsigned AVCodecID alias consistently.
rsmpeg = { path = "vendor/rsmpeg" }
