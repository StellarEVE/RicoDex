[workspace]
resolver = "2"
members = [
    "crates/music video-core",
    "crates/music video-audio",
    "crates/music video-media",
    "crates/music video-platform",
    "crates/music video-render",
    "crates/music video-engine",
    "crates/music video-app",
    "crates/music video-cli",
]

[workspace.package]
version = "0.1.0-alpha.9"
edition = "2021"
license = "Apache-2.0"
description = "RicoDex: a local beat-synced music video editor"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
